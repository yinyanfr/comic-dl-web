name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
      COMIC_DL_WEB_TEST_OUTPUT_MARKER: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: test-results

  container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      HUSKY: "0"
      CONTAINER_IMAGE: comic-dl-web:test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: comic-dl-web:test
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate Compose configuration
        run: docker compose config --quiet
        env:
          IMAGE: comic-dl-web:test
          DATA_DIRECTORY: /tmp/comic-dl-web-data
          DOWNLOAD_DIRECTORY: /tmp/comic-dl-web-downloads
          COMIC_DL_WEB_ADMIN_PASSWORD: ci-placeholder
      - run: npm run test:container
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: container-test-results-${{ matrix.arch }}
          path: test-results/container
