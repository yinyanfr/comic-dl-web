services:
  comic-dl-web:
    # Set IMAGE to a published version or digest; no floating latest default.
    image: ${IMAGE:?Set IMAGE in .env to a published version or a local build}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    init: true
    restart: unless-stopped
    stop_grace_period: 90s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    environment:
      COMIC_DL_WEB_ADMIN_PASSWORD: ${COMIC_DL_WEB_ADMIN_PASSWORD:?Set a nonempty administrator password}
      COMIC_DL_WEB_ENABLE_EXTENSION_MANAGEMENT: ${COMIC_DL_WEB_ENABLE_EXTENSION_MANAGEMENT:-0}
      COMIC_DL_WEB_WATCH_INTERVAL: ${COMIC_DL_WEB_WATCH_INTERVAL:-3600}
    volumes:
      - type: bind
        source: ${DATA_DIRECTORY:?Set DATA_DIRECTORY to an existing local directory}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${DOWNLOAD_DIRECTORY:?Set DOWNLOAD_DIRECTORY to an existing comic directory}
        target: /downloads
        bind:
          create_host_path: false
