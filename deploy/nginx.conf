# Put inside Nginx's http context. Replace hostname and certificate paths.
# This example assumes Nginx runs on the host, not in another container.
server {
    listen 443 ssl;
    server_name comics.example.com;

    ssl_certificate /etc/nginx/certs/comics.example.com.crt;
    ssl_certificate_key /etc/nginx/certs/comics.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        # The application does not trust forwarded headers. Configure
        # COMIC_DL_WEB_ADMIN_ORIGIN=https://comics.example.com explicitly.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
